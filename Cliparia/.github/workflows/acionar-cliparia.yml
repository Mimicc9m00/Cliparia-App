name: Acionar servidor do Cliparia

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
    secrets:
      CLIPARIA_AUTOMATION_TOKEN:
        required: true

permissions: {}

jobs:
  acionamento:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLIPARIA_URL: ${{ vars.CLIPARIA_URL }}
      CLIPARIA_OPERATION: ${{ inputs.operation }}
      CLIPARIA_TOKEN: ${{ secrets.CLIPARIA_AUTOMATION_TOKEN }}
    steps:
      - name: Solicitar execução ao servidor
        shell: bash
        run: |
          if [[ ! "$CLIPARIA_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?/?$ || ! "$CLIPARIA_TOKEN" =~ ^[a-fA-F0-9]{64}$ ]]; then
            echo 'Confira CLIPARIA_URL e CLIPARIA_AUTOMATION_TOKEN no repositório.'
            exit 1
          fi
          case "$CLIPARIA_OPERATION" in
            continuous|posting) ;;
            *) exit 1 ;;
          esac
          status=$(curl --silent --show-error --proto '=https' --connect-timeout 8 --max-time 20 \
            --request POST --header "Authorization: Bearer $CLIPARIA_TOKEN" \
            --output /dev/null --write-out '%{http_code}' \
            "${CLIPARIA_URL%/}/api/automation/$CLIPARIA_OPERATION")
          if [[ "$status" != 202 ]]; then
            printf 'O servidor do Cliparia respondeu HTTP %s.\n' "$status"
            exit 1
          fi
          echo 'O servidor aceitou o acionamento.'
