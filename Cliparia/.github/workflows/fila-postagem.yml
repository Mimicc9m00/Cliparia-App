name: Cliparia · Processar fila de postagem

on:
  workflow_dispatch:
  schedule:
    - cron: '11,26,41,56 * * * *'

permissions: {}
concurrency: cliparia-fila-postagem

jobs:
  processar:
    if: ${{ vars.CLIPARIA_URL != '' }}
    uses: ./.github/workflows/acionar-cliparia.yml
    with:
      operation: posting
    secrets:
      CLIPARIA_AUTOMATION_TOKEN: ${{ secrets.CLIPARIA_AUTOMATION_TOKEN }}
