name: Cliparia · Verificar fontes do Contínuo

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions: {}
concurrency: cliparia-continuo

jobs:
  verificar:
    if: ${{ vars.CLIPARIA_URL != '' }}
    uses: ./.github/workflows/acionar-cliparia.yml
    with:
      operation: continuous
    secrets:
      CLIPARIA_AUTOMATION_TOKEN: ${{ secrets.CLIPARIA_AUTOMATION_TOKEN }}
